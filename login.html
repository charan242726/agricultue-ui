<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroEase Login</title>
  <meta name="description" content="Secure portal for AgroEase.">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

    :root {
      --font: 'Outfit', 'Inter', sans-serif;
      --glow-primary: #10b981;
      --glow-secondary: #0ea5e9;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --input-bg: rgba(241, 245, 249, 0.7);
      --input-border: rgba(203, 213, 225, 0.6);
    }

    body {
      font-family: var(--font);
      background: linear-gradient(160deg, #fdf6e3 0%, #e8f5e9 40%, #e0f2f1 100%);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* === RICH AGRICULTURAL BACKGROUND === */

    /* Warm golden sun glow top-left */
    .bg-sun {
      position: fixed;
      top: -120px;
      left: -120px;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.35) 0%, rgba(251, 191, 36, 0.08) 50%, transparent 70%);
      z-index: 0;
      animation: sunPulse 8s ease-in-out infinite alternate;
    }
    @keyframes sunPulse {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    /* Soft green hill at the bottom */
    .bg-hills {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 0;
      opacity: 0.18;
      pointer-events: none;
    }

    /* Field row stripes */
    .bg-field {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      z-index: 0;
      background: repeating-linear-gradient(
        90deg,
        rgba(16, 185, 129, 0.06) 0px,
        rgba(16, 185, 129, 0.06) 30px,
        transparent 30px,
        transparent 60px
      );
      pointer-events: none;
    }

    /* Floating crop particles */
    .particle {
      position: fixed;
      font-size: 1.5rem;
      opacity: 0;
      z-index: 0;
      animation: particleFly linear infinite;
      pointer-events: none;
      user-select: none;
    }
    @keyframes particleFly {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Drifting bubble dots */
    .bg-bubble {
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      opacity: 0;
      animation: bubbleDrift ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes bubbleDrift {
      0%   { transform: translateY(0)    scale(1);    opacity: 0; }
      20%  { opacity: 0.5; }
      80%  { opacity: 0.3; }
      100% { transform: translateY(-80px) scale(1.1); opacity: 0; }
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.05); }
    }

    /* Sliding Panel Container */
    .auth-container {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 20px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
      width: 1100px;
      max-width: 95vw;
      min-height: 680px;
      z-index: 2;
    }

    .form-container {
      position: absolute;
      top: 0;
      height: 100%;
      transition: all 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 4rem;
    }

    .sign-in-container {
      left: 0;
      width: 50%;
      z-index: 2;
    }
    
    .auth-container.right-panel-active .sign-in-container {
      transform: translateX(100%);
      opacity: 0;
      z-index: 1;
    }

    .sign-up-container {
      left: 0;
      width: 50%;
      opacity: 0;
      z-index: 1;
      transform: translateX(50%);
    }

    .auth-container.right-panel-active .sign-up-container {
      transform: translateX(100%);
      opacity: 1;
      z-index: 5;
      animation: show 0.6s;
    }

    @keyframes show {
      0%, 49.99% { opacity: 0; z-index: 1; }
      50%, 100% { opacity: 1; z-index: 5; }
    }

    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), border-radius 0.6s;
      z-index: 100;
      border-radius: 0 24px 24px 0;
    }

    .auth-container.right-panel-active .overlay-container {
      transform: translateX(-100%);
      border-radius: 24px 0 0 24px;
    }

    .overlay-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 0.6s ease-in-out;
    }
    .img-signin {
      background-image: url('img/farmer-auth.jpg');
      opacity: 1;
    }
    .img-signup {
      background-image: url('img/farmer-auth2.png');
      opacity: 0;
    }

    .auth-container.right-panel-active .img-signin {
      opacity: 0;
    }
    .auth-container.right-panel-active .img-signup {
      opacity: 1;
    }
    
    /* Subtle vignette to make the image slightly softer at the edges but beautifully clear */
    .overlay-container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.2) 100%);
      pointer-events: none;
    }

    /* Common Form Elements */
    form {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .auth-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #10b981, #0ea5e9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .auth-subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      margin-bottom: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
      position: relative;
    }
    
    /* Make signup slightly tighter to fit */
    .sign-up-container .form-group {
      margin-bottom: 0.75rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-left: 0.25rem;
    }

    .form-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      padding: 0.9rem 1.25rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: var(--font);
      outline: none;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      width: 100%;
    }

    .form-input::placeholder {
      color: rgba(148, 163, 184, 0.8);
    }

    .form-input:focus {
      border-color: var(--glow-primary);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
      background: #ffffff;
    }

    .btn-auth {
      margin-top: 1rem;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .btn-auth:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
    }

    .toggle-auth {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-sub);
    }
    
    .toggle-auth span {
      color: var(--glow-primary);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .toggle-auth span:hover {
      color: #059669;
      text-decoration: underline;
    }

    /* Autocomplete Styling */
    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      z-index: 100;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      list-style: none;
      padding: 0.5rem;
      margin: 0;
    }

    .autocomplete-dropdown::-webkit-scrollbar { width: 6px; }
    .autocomplete-dropdown::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

    .autocomplete-item {
      padding: 0.8rem 1rem;
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .autocomplete-item .state-tag {
      font-size: 0.75rem;
      color: var(--glow-primary);
      background: rgba(16, 185, 129, 0.1);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    /* Andhra Pradesh cities get a special brighter green tag + auto-fill icon hint */
    .autocomplete-item .state-tag.ap-tag {
      color: #ffffff;
      background: linear-gradient(135deg, #10b981, #059669);
      font-weight: 600;
    }

    /* Flash animation on auto-filled district */
    @keyframes districtAutofill {
      0%   { border-color: var(--input-border); box-shadow: none; }
      30%  { border-color: #10b981; box-shadow: 0 0 14px rgba(16,185,129,0.35); }
      100% { border-color: var(--input-border); box-shadow: none; }
    }
    .autocomplete-item:hover { background: rgba(0, 0, 0, 0.04); }
    .autocomplete-loading { padding: 0.8rem 1rem; color: var(--text-sub); font-size: 0.9rem; text-align: center; }

    .input-error-text {
      color: #ef4444;
      font-size: 0.8rem;
      margin-top: 0.25rem;
      display: none;
      margin-left: 0.25rem;
    }
    .ui-error-border {
      border-color: #ef4444 !important;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.1) !important;
    }

    /* District Dropdown adjustments */
    .ui-dropdown-header {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-main);
      border-radius: 12px;
      padding: 0.9rem 1.25rem;
      font-size: 0.95rem;
      width: 100%;
      cursor: pointer;
    }
    .ui-dropdown-menu {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: absolute;
      width: 100%;
      max-height: 180px;
      overflow-y: auto;
      z-index: 50;
    }
    
    /* Responsive */
    @media (max-width: 800px) {
      .auth-container { min-height: 800px; width: 100%; border-radius: 0; }
      .form-container { width: 100%; height: 50%; padding: 0 2rem; }
      .sign-in-container { top: 0; }
      .sign-up-container { top: 50%; width: 100%; transform: translateX(0); opacity: 1; }
      .overlay-container { display: none; }
      .auth-container.right-panel-active .sign-in-container { transform: none; }
      .auth-container.right-panel-active .sign-up-container { transform: none; }
    }
  </style>
</head>
<body>
  
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="auth-container" id="auth-container">
    
    <!-- Sign Up Form (Right Panel initially hidden to left) -->
    <div class="form-container sign-up-container">
      <form id="signup-form" novalidate>
        <!-- The title is explicitly "Hello, Farmer!" as requested -->
        <h1 class="auth-title">Hello, Farmer!</h1>
        <div class="auth-subtitle">Join the AgroEase Network</div>
        
        <div class="form-group">
          <label>Full Name</label>
          <input id="su-name" class="form-input" type="text" maxlength="60" placeholder="Full Name" required>
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input id="su-phone" class="form-input" type="tel" inputmode="numeric" placeholder="10-digit number" required>
        </div>

        <div class="form-group">
          <label>Village / City</label>
          <input id="su-village" class="form-input autocomplete-input" type="text" placeholder="e.g. 'Bhimavaram'" autocomplete="off" required>
          <ul id="su-autocomplete" class="autocomplete-dropdown"></ul>
        </div>

        <div class="form-group">
          <label>District</label>
          <div id="su-district-dropdown"></div>
          <div id="su-district-error" class="input-error-text"></div>
        </div>

        <button type="submit" class="btn-auth" id="signup-btn">Sign Up</button>
        
        <div class="toggle-auth">
          Already have an account? <span id="signIn">Sign In Here</span>
        </div>
      </form>
    </div>

    <!-- Sign In Form (Left Panel initially active) -->
    <div class="form-container sign-in-container">
      <form id="signin-form" novalidate>
        <!-- Title is explicitly "Welcome Back!" as requested -->
        <h1 class="auth-title">Welcome Back!</h1>
        <div class="auth-subtitle">Farmer Login Portal</div>

        <div class="form-group">
           <label>Mobile Number</label>
           <input id="si-phone" class="form-input" type="tel" inputmode="numeric" placeholder="10-digit number" required>
        </div>

        <div class="form-group">
           <label>Village / City</label>
           <input id="si-village" class="form-input autocomplete-input" type="text" placeholder="e.g. 'Bhimavaram'" autocomplete="off" required>
           <ul id="si-autocomplete" class="autocomplete-dropdown"></ul>
        </div>
        
        <div class="form-group">
           <label>District</label>
           <div id="si-district-dropdown"></div>
           <div id="si-district-error" class="input-error-text"></div>
        </div>

        <button type="submit" class="btn-auth" id="signin-btn">Sign In</button>

        <div class="toggle-auth">
          Don't have an account? <span id="signUp">Create Account</span>
        </div>
      </form>
    </div>

    <!-- Overlay Panels (Crossfading Images matching Sign-In / Sign-Up state!) -->
    <div class="overlay-container">
      <div class="overlay-img img-signin"></div>
      <div class="overlay-img img-signup"></div>
    </div>

  </div>

  <!-- ===== RICH AGRICULTURAL BACKGROUND ===== -->

  <!-- Warm sun glow -->
  <div class="bg-sun"></div>

  <!-- Bottom field stripes -->
  <div class="bg-field"></div>

  <!-- SVG rolling hills -->
  <svg class="bg-hills" viewBox="0 0 1440 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0,160 C200,60 400,200 600,120 C800,40 1000,180 1200,100 C1300,60 1380,140 1440,100 L1440,220 L0,220 Z"
      fill="#10b981"/>
    <path d="M0,190 C300,100 500,220 700,160 C900,100 1100,200 1440,140 L1440,220 L0,220 Z"
      fill="#059669" opacity="0.6"/>
  </svg>

  <!-- Floating crop emoji particles injected by JS below -->

  <!-- Main Auth Card -->
  <script src="js/ui.js"></script>
  <script>
    const WEATHER_API_KEY = '3e5df347332ed43921d6127f44f81e78';
    
    // Panel Sliding Logic Triggered by links inside forms
    const signUpButton = document.getElementById('signUp');
    const signInButton = document.getElementById('signIn');
    const container = document.getElementById('auth-container');

    signUpButton.addEventListener('click', () => {
      container.classList.add("right-panel-active");
    });
    signInButton.addEventListener('click', () => {
      container.classList.remove("right-panel-active");
    });

    // --- Validation Helpers ---
    function showError(input, message) {
      input.classList.add('ui-error-border');
      let errEl = input.nextElementSibling;
      if (errEl && !errEl.classList.contains('input-error-text') && !errEl.classList.contains('autocomplete-dropdown')) {
        errEl = document.createElement('div');
        errEl.className = 'input-error-text';
        input.parentNode.insertBefore(errEl, input.nextSibling);
      } else if (!errEl || !errEl.classList.contains('input-error-text')){
        errEl = input.parentNode.querySelector('.input-error-text');
        if(!errEl) {
          errEl = document.createElement('div');
          errEl.className = 'input-error-text';
          input.parentNode.appendChild(errEl);
        }
      }
      errEl.innerHTML = `⚠️ ${message}`;
      errEl.style.display = 'block';
    }

    function clearError(input) {
      input.classList.remove('ui-error-border');
      let errEl = input.parentNode.querySelector('.input-error-text');
      if (errEl) {
        errEl.style.display = 'none';
      }
    }

    // --- District Dropdown Integration ---
    const districts = [
      "Alluri Sitharama Raju", "Anakapalli", "Anantapuram", "Annamayya", "Bapatla", 
      "Chittoor", "Dr. B. R. Ambedkar Konaseema", "East Godavari", "Eluru", "Guntur", 
      "Kakinada", "Krishna", "Kurnool", "Nandyal", "NTR", "Palnadu", "Parvathipuram Manyam", 
      "Prakasam", "Sri Potti Sriramulu Nellore", "Sri Sathya Sai", "Srikakulam", 
      "Tirupati", "Visakhapatnam", "Vizianagaram", "West Godavari", "YSR"
    ];

    const suDistrict = UI.initDropdown('su-district-dropdown', districts, () => {
      const err = document.getElementById('su-district-error');
      if(err) err.style.display = 'none';
      if(suDistrict.setError) suDistrict.setError(false);
    });
    
    const siDistrict = UI.initDropdown('si-district-dropdown', districts, () => {
      const err = document.getElementById('si-district-error');
      if(err) err.style.display = 'none';
      if(siDistrict.setError) siDistrict.setError(false);
    });

    // --- AP City → District Auto-Map ---
    // When user picks a city that belongs to Andhra Pradesh, automatically
    // find its district and select it in the dropdown.
    const apCityToDistrict = {
      // West Godavari
      "bhimavaram": "West Godavari", "narsapur": "West Godavari", "palakol": "West Godavari",
      "tadepalligudem": "West Godavari", "akividu": "West Godavari",
      // East Godavari / Kakinada
      "kakinada": "Kakinada", "rajahmundry": "East Godavari", "rajamahendravaram": "East Godavari",
      "amalapuram": "Dr. B. R. Ambedkar Konaseema", "kovvur": "East Godavari",
      "ramachandrapuram": "Dr. B. R. Ambedkar Konaseema",
      // Eluru
      "eluru": "Eluru", "nuzvid": "Eluru",
      // Krishna / NTR
      "vijayawada": "NTR", "machilipatnam": "Krishna", "gudivada": "Krishna",
      "krishna": "Krishna", "vuyyuru": "Krishna",
      // Guntur / Bapatla
      "guntur": "Guntur", "tenali": "Guntur", "mangalagiri": "Guntur",
      "narasaraopet": "Palnadu", "bapatla": "Bapatla", "chirala": "Bapatla",
      "repalle": "Bapatla",
      // Nellore
      "nellore": "Sri Potti Sriramulu Nellore", "kavali": "Sri Potti Sriramulu Nellore",
      "gudur": "Sri Potti Sriramulu Nellore",
      // Tirupati / Chittoor
      "tirupati": "Tirupati", "chittoor": "Chittoor", "madanapalle": "Annamayya",
      "kuppam": "Chittoor", "srikalahasti": "Tirupati",
      // Kurnool / Nandyal
      "kurnool": "Kurnool", "nandyal": "Nandyal", "adoni": "Kurnool",
      "dhone": "Nandyal",
      // Kadapa / YSR / Annamayya
      "kadapa": "YSR", "proddatur": "YSR", "rajampet": "Annamayya",
      // Anantapuram / Sri Sathya Sai
      "anantapur": "Anantapuram", "anantapuram": "Anantapuram",
      "hindupur": "Sri Sathya Sai", "dharmavaram": "Sri Sathya Sai",
      // Visakhapatnam / Anakapalli
      "visakhapatnam": "Visakhapatnam", "vishakhapatnam": "Visakhapatnam",
      "vizag": "Visakhapatnam", "anakapalli": "Anakapalli", "narsipatnam": "Anakapalli",
      // Vizianagaram / Srikakulam
      "vizianagaram": "Vizianagaram", "bobbili": "Vizianagaram",
      "srikakulam": "Srikakulam", "narasannapeta": "Srikakulam",
      // Alluri / Parvathipuram
      "paderu": "Alluri Sitharama Raju", "parvathipuram": "Parvathipuram Manyam",
      "saluru": "Parvathipuram Manyam",
    };

    function autoSelectDistrict(cityName, districtDD, errorId) {
      const key = cityName.toLowerCase().trim();
      const matched = apCityToDistrict[key];
      if (matched && districtDD && districtDD.setValue) {
        districtDD.setValue(matched);
        const err = document.getElementById(errorId);
        if(err) err.style.display = 'none';
        if(districtDD.setError) districtDD.setError(false);

        // Briefly flash the district field to indicate it was auto-filled
        const header = document.querySelector(`#${errorId.replace('-error','-dropdown')} .ui-dropdown-header`);
        if(header) {
          header.style.transition = 'box-shadow 0.3s, border-color 0.3s';
          header.style.borderColor = '#10b981';
          header.style.boxShadow = '0 0 10px rgba(16,185,129,0.3)';
          setTimeout(() => {
            header.style.borderColor = '';
            header.style.boxShadow = '';
          }, 1500);
        }
      }
    }

    // --- Geocoding Autocomplete Logic (Shared function) ---
    function attachAutocomplete(inputId, dropdownId, districtDD, districtErrorId) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);
      let debounceTimer;

      input.addEventListener('input', (e) => {
        clearError(input);
        const query = e.target.value.trim();
        clearTimeout(debounceTimer);
        
        if (query.length < 2) {
          dropdown.style.display = 'none';
          return;
        }
        
        dropdown.style.display = 'block';
        dropdown.innerHTML = '<li class="autocomplete-loading">Searching locations...</li>';

        debounceTimer = setTimeout(() => {
          fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=${WEATHER_API_KEY}`)
            .then(res => res.json())
            .then(data => {
              if (!data || data.length === 0) {
                dropdown.innerHTML = '<li class="autocomplete-loading">No locations found</li>';
                return;
              }
              
              const uniqueCities = [];
              const seen = new Set();
              data.forEach(item => {
                 const key = `${item.name}-${item.state || item.country}`;
                 if(!seen.has(key)) {
                   seen.add(key);
                   uniqueCities.push(item);
                 }
              });

              dropdown.innerHTML = uniqueCities.map(city => {
                const region = city.state ? city.state : city.country;
                const isAP = city.state === 'Andhra Pradesh';
                return `<li class="autocomplete-item" 
                            data-name="${city.name}" 
                            data-state="${city.state || ''}"
                            data-country="${city.country || ''}">
                          <span>${city.name}</span>
                          <span class="state-tag ${isAP ? 'ap-tag' : ''}">${region}</span>
                        </li>`;
              }).join('');
              
              document.querySelectorAll(`#${dropdownId} .autocomplete-item`).forEach(item => {
                item.addEventListener('click', (ev) => {
                  const el = ev.currentTarget;
                  input.value = el.dataset.name;
                  dropdown.style.display = 'none';
                  clearError(input);

                  // Auto-select district if city is from AP
                  if (el.dataset.state === 'Andhra Pradesh') {
                    autoSelectDistrict(el.dataset.name, districtDD, districtErrorId);
                  }
                });
              });
            }).catch(err => {
              dropdown.innerHTML = '<li class="autocomplete-loading" style="color:#ef4444">Connection Failed</li>';
            });
        }, 400); 
      });

      // Hide dropdown when clicking outside
      document.addEventListener('click', (e) => {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      });
    }

    attachAutocomplete('su-village', 'su-autocomplete', suDistrict, 'su-district-error');
    attachAutocomplete('si-village', 'si-autocomplete', siDistrict, 'si-district-error');

    // Phone parsing
    const suPhone = document.getElementById('su-phone');
    const siPhone = document.getElementById('si-phone');
    [suPhone, siPhone].forEach(input => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 10);
        clearError(input);
      });
    });

    const suName = document.getElementById('su-name');
    suName.addEventListener('input', () => clearError(suName));

    // --- Form Submit Handlers ---
    
    function validateAndStore(name, phone, village, district, prefix) {
      let isValid = true;
      document.querySelectorAll('.input-error-text').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.ui-error-border').forEach(el => el.classList.remove('ui-error-border'));

      if (prefix === 'su') {
         if (!name || name.length < 2) {
           showError(suName, 'Full Name is required');
           isValid = false;
         }
      }

      const phoneInput = prefix === 'su' ? suPhone : siPhone;
      if (!/^[0-9]{10}$/.test(phone)) {
        showError(phoneInput, 'Invalid Mobile (10 digits)');
        isValid = false;
      }

      const villageInput = document.getElementById(`${prefix}-village`);
      if (!village) {
        showError(villageInput, 'Village is required');
        isValid = false;
      }

      if (!district) {
        const err = document.getElementById(`${prefix}-district-error`);
        if(err) {
            err.innerHTML = '⚠️ District is required';
            err.style.display = 'block';
        }
        const dd = prefix === 'su' ? suDistrict : siDistrict;
        if(dd.setError) dd.setError(true);
        isValid = false;
      }

      if (!isValid) return false;

      // Mock DB: Save name only if registering, otherwise retrieve standard name
      if (prefix === 'su') localStorage.setItem('farmerName', name);
      else if (!localStorage.getItem('farmerName')) localStorage.setItem('farmerName', 'Farmer');
      
      localStorage.setItem('farmerPhone', phone);
      localStorage.setItem('farmerVillage', village);
      localStorage.setItem('farmerDistrict', district);
      localStorage.setItem('loginTime', Date.now());
      return true;
    }

    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const n = suName.value.trim();
      const p = suPhone.value.trim();
      const v = document.getElementById('su-village').value.trim();
      const d = suDistrict.getValue ? suDistrict.getValue() : null;

      if (validateAndStore(n, p, v, d, 'su')) {
        const btn = document.getElementById('signup-btn');
        UI.setButtonLoading(btn, true, 'Registering...');
        UI.toast('Account Created! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      } else {
        UI.toast('Please fix the errors to try again', 'error');
      }
    });

    document.getElementById('signin-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const p = siPhone.value.trim();
      const v = document.getElementById('si-village').value.trim();
      const d = siDistrict.getValue ? siDistrict.getValue() : null;

      if (validateAndStore(null, p, v, d, 'si')) {
        const btn = document.getElementById('signin-btn');
        UI.setButtonLoading(btn, true, 'Logging in...');
        UI.toast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      } else {
        UI.toast('Please fix the errors to try again', 'error');
      }
    });

  </script>

  <!-- ===== FLOATING PARTICLE GENERATOR ===== -->
  <script>
    (function() {
      // Crop & nature emojis to float up the screen
      const icons = ['🌾', '🍃', '🌱', '🌿', '🌻', '💧', '🍀', '🌼', '🎋', '🌸'];
      const colors = [
        'rgba(16,185,129,0.25)',   // green
        'rgba(251,191,36,0.25)',   // golden
        'rgba(34,197,94,0.2)',     // light green
        'rgba(14,165,233,0.2)',    // sky blue
      ];

      // Inject 18 floating emoji particles
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = icons[Math.floor(Math.random() * icons.length)];
        p.style.cssText = [
          `left: ${Math.random() * 100}vw`,
          `font-size: ${0.9 + Math.random() * 1.4}rem`,
          `animation-duration: ${12 + Math.random() * 16}s`,
          `animation-delay: ${-Math.random() * 20}s`,
          `opacity: 0`,
        ].join(';');
        document.body.appendChild(p);
      }

      // Inject 12 soft colour bubbles that drift upward gently
      for (let i = 0; i < 12; i++) {
        const b = document.createElement('div');
        b.className = 'bg-bubble';
        const size = 30 + Math.random() * 70;
        b.style.cssText = [
          `width: ${size}px`,
          `height: ${size}px`,
          `left: ${Math.random() * 100}vw`,
          `top: ${20 + Math.random() * 70}vh`,
          `background: ${colors[Math.floor(Math.random() * colors.length)]}`,
          `filter: blur(${4 + Math.random() * 10}px)`,
          `animation-duration: ${8 + Math.random() * 12}s`,
          `animation-delay: ${-Math.random() * 10}s`,
        ].join(';');
        document.body.appendChild(b);
      }
    })();
  </script>
